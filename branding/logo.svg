<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161827"/>
      <stop offset="1" stop-color="#0A0B14"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="92" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Waveform bars that trace a "W" -->
  <g fill="url(#wave)" filter="url(#glow)">
    <rect x="92"  y="150" width="30" height="212" rx="15"/>
    <rect x="142" y="206" width="30" height="156" rx="15"/>
    <rect x="192" y="262" width="30" height="100" rx="15"/>
    <rect x="241" y="190" width="30" height="172" rx="15"/>
    <rect x="290" y="262" width="30" height="100" rx="15"/>
    <rect x="340" y="206" width="30" height="156" rx="15"/>
    <rect x="390" y="150" width="30" height="212" rx="15"/>
  </g>
  <!-- the "learning" spark above the centre bar -->
  <circle cx="256" cy="140" r="17" fill="#22D3EE" filter="url(#glow)"/>
</svg>
