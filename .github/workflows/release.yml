name: Build & release APK

# Every push builds the app. When the version in app/build.gradle.kts is new
# (no matching git tag yet), the signed APK is published on the Releases page.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: |
          name=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$name" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are not set up yet, so no release will be published. See SIGNING setup in PLAN.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          WAVELENGTH_KEYSTORE_PATH: ${{ steps.signing.outputs.ready == 'true' && format('{0}/release.p12', runner.temp) || '' }}
          WAVELENGTH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WAVELENGTH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WAVELENGTH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$WAVELENGTH_KEYSTORE_PATH" ] || unset WAVELENGTH_KEYSTORE_PATH
          ./gradlew assembleRelease --no-configuration-cache
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Wavelength-${{ steps.version.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Wavelength-${{ steps.version.outputs.tag }}
          path: dist/*.apk

      - name: Publish release
        if: steps.signing.outputs.ready == 'true' && steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Wavelength ${{ steps.version.outputs.tag }}
          body_path: docs/release-notes/${{ steps.version.outputs.tag }}.md
          files: dist/*.apk
          make_latest: true
